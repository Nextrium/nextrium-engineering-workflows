name: Reusable Python CI
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: Project directory
        required: false
        type: string
        default: "."
permissions: {}
jobs:
  python:
    name: Python lint, type, dependency, and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install project and quality tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[dev]' || python -m pip install -e .; fi
          python -m pip install ruff mypy pip-audit
      - name: Ruff lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check when configured
        shell: bash
        run: |
          if [[ -f mypy.ini || -f .mypy.ini || -f pyproject.toml ]]; then mypy .; else echo "No mypy configuration; type-check step skipped."; fi
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Tests
        shell: bash
        run: |
          if [[ -d tests || -d test ]]; then python -m pytest; else echo "No tests directory; test step skipped."; fi
