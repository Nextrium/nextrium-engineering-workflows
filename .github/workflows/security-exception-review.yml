name: Security Exception Review

on:
  schedule:
    - cron: "0 9 1 1,4,7,10 *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-exception-review.yml"
      - "docs/SECURITY-EXCEPTIONS.md"
      - ".gitleaksignore"
      - "scripts/validate_security_exceptions.py"
      - "tests/test_validate_security_exceptions.py"
  pull_request:
    paths:
      - ".github/workflows/security-exception-review.yml"
      - "docs/SECURITY-EXCEPTIONS.md"
      - ".gitleaksignore"
      - "scripts/validate_security_exceptions.py"
      - "tests/test_validate_security_exceptions.py"
  workflow_dispatch:
  workflow_call:
    inputs:
      validator-ref:
        description: Full commit SHA of the central workflow repository used for the validator
        required: true
        type: string
      ledger-path:
        description: Consumer repository path to the security exception ledger
        required: false
        type: string
        default: "docs/SECURITY-EXCEPTIONS.md"
      ignore-path:
        description: Consumer repository path to the Gitleaks ignore file
        required: false
        type: string
        default: ".gitleaksignore"
      allow-empty-ledger:
        description: Allow a consumer with no exceptions only when its ignore file is also empty
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  review-freshness:
    name: Validate exception ledger and ignore entries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout consumer source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout pinned central validator
        if: ${{ inputs.validator-ref != '' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Nextrium/nextrium-engineering-workflows
          ref: ${{ inputs.validator-ref }}
          path: .nextrium-engineering-workflows
          persist-credentials: false

      - name: Test central review validator
        shell: bash
        env:
          VALIDATOR_REF: ${{ inputs.validator-ref }}
        run: |
          if [[ -n "$VALIDATOR_REF" ]]; then
            python3 -m unittest discover -s .nextrium-engineering-workflows/tests -p 'test_validate_security_exceptions.py' -v
          else
            python3 -m unittest discover -s tests -p 'test_validate_security_exceptions.py' -v
          fi

      - name: Validate ledger freshness and suppression alignment
        shell: bash
        env:
          VALIDATOR_REF: ${{ inputs.validator-ref }}
          LEDGER_PATH: ${{ inputs.ledger-path || 'docs/SECURITY-EXCEPTIONS.md' }}
          IGNORE_PATH: ${{ inputs.ignore-path || '.gitleaksignore' }}
          ALLOW_EMPTY_LEDGER: ${{ inputs.allow-empty-ledger && 'true' || 'false' }}
        run: |
          if [[ -n "$VALIDATOR_REF" ]]; then
            validator=".nextrium-engineering-workflows/scripts/validate_security_exceptions.py"
          else
            validator="scripts/validate_security_exceptions.py"
          fi
          args=(--ledger-path "$LEDGER_PATH" --ignore-path "$IGNORE_PATH")
          if [[ "$ALLOW_EMPTY_LEDGER" == "true" ]]; then args+=(--allow-empty-ledger); fi
          python3 "$validator" "${args[@]}"
