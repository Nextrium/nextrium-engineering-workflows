name: Security Baseline Go Scan Self-Test

on:
  pull_request:
    paths:
      - ".github/workflows/security-baseline.yml"
      - ".github/workflows/security-baseline-go-selftest.yml"
      - ".github/test-fixtures/go-module/**"
  workflow_dispatch:

permissions: {}

jobs:
  go-vulnerability-self-test:
    uses: ./.github/workflows/security-baseline.yml
    with:
      scan-go: true
      working-directory: .github/test-fixtures/go-module
