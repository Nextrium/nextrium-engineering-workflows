name: Reusable TypeScript CI
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "22"
      working-directory:
        description: Directory containing package.json
        required: false
        type: string
        default: "."
permissions: {}
jobs:
  typescript:
    name: TypeScript lint, type-check, audit, and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Require deterministic lockfile
        shell: bash
        run: |
          test -f package.json || { echo "package.json is required"; exit 1; }
          test -f package-lock.json || { echo "package-lock.json is required; commit a lockfile"; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Lint when configured
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script configured; skipped."
          fi
      - name: Type check when configured
        shell: bash
        run: |
          if node -e "const s=require('./package.json').scripts || {}; process.exit(s.typecheck || s['type-check'] ? 0 : 1)"; then
            if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then npm run typecheck; else npm run type-check; fi
          else
            echo "No type-check script configured; skipped."
          fi
      - name: Tests when configured
        run: npm test --if-present
