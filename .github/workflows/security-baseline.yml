name: Reusable Security Baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      scan-go:
        description: Run govulncheck against a Go module in working-directory
        required: false
        type: boolean
        default: false
      working-directory:
        description: Project directory containing go.mod when scan-go is enabled
        required: false
        type: string
        default: "."
permissions: {}
jobs:
  secrets:
    name: Secret detection (Git history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: stable
          cache: false
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Validate Gitleaks positive, negative, and redaction behaviour
        shell: bash
        run: |
          set -euo pipefail
          gitleaks="$(go env GOPATH)/bin/gitleaks"
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          mkdir -p "$fixture_dir/positive" "$fixture_dir/negative"
          printf '%s\n' 'AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE' > "$fixture_dir/positive/fixture.env"

          set +e
          output="$("$gitleaks" dir "$fixture_dir/positive" --redact --exit-code 1 2>&1)"
          scan_status=$?
          set -e
          if [[ "$scan_status" -eq 0 ]]; then
            echo "Gitleaks failed to detect the controlled positive fixture."
            exit 1
          fi
          if grep -Fq 'AKIAIOSFODNN7EXAMPLE' <<< "$output"; then
            echo "Gitleaks output exposed the controlled test credential."
            exit 1
          fi
          "$gitleaks" dir "$fixture_dir/negative" --redact --exit-code 1

      - name: Scan repository and Git history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --exit-code 1

  workflow-analysis:
    name: GitHub Actions security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflow security with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: "1.32.0"

  go-vulnerability:
    name: Go vulnerability analysis
    if: ${{ inputs.scan-go }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify Go module exists
        working-directory: ${{ inputs.working-directory }}
        run: test -f go.mod
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          work-dir: ${{ inputs.working-directory }}
          go-package: ./...
