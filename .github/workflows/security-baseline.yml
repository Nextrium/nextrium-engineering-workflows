name: Reusable Security Baseline
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      scan-go:
        description: Run govulncheck against a Go module in working-directory
        required: false
        type: boolean
        default: false
      working-directory:
        description: Project directory containing go.mod when scan-go is enabled
        required: false
        type: string
        default: "."
permissions: {}
jobs:
  secrets:
    name: Secret detection (Git history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.5.0
        with:
          go-version: stable
          cache: false
      - name: Install pinned Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan repository and Git history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --exit-code 1

  workflow-analysis:
    name: GitHub Actions security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit workflow security with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: "1.32.0"

  go-vulnerability:
    name: Go vulnerability analysis
    if: ${{ inputs.scan-go }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify Go module exists
        working-directory: ${{ inputs.working-directory }}
        run: test -f go.mod
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          work-dir: ${{ inputs.working-directory }}
          go-package: ./...
